name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to avoid wasted
# runner minutes and race conditions on shared resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Lint
  # Runs ruff on all Python sources. Fails fast so test job is only
  # triggered when the code is clean.
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Resolve uv from `[tool.uv] required-version` in pyproject.toml, so CI
          # and local development are held to the same floor and ceiling.
          version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint with ruff
        run: uv run ruff check safeuploads tests examples

      - name: Check formatting with ruff
        run: uv run ruff format --check safeuploads tests examples

      - name: Type check with mypy
        run: uv run mypy

  # ----------------------------------------------------------------
  # Type check with ty (advisory)
  # ty is pre-1.0 and runs beside mypy for evaluation: findings are
  # reported but never block a merge. mypy is the gate.
  # ----------------------------------------------------------------
  typecheck-ty:
    name: Type check (ty, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml

      - name: Install dependencies
        # Same environment as the mypy step: ty resolves third-party types from it.
        run: uv sync --frozen --dev --extra fastapi

      - name: Type check (ty)
        run: uv run --no-sync ty check --python .venv

  # ----------------------------------------------------------------
  # Test
  # Runs the full pytest suite with coverage. Only runs after lint
  # passes so we don't waste runner minutes on broken code.
  # ----------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen --dev --extra fastapi

      - name: Audit Python dependencies
        run: uvx pip-audit --require-hashes --disable-pip -r <(uv export --frozen --no-header --no-emit-project --no-dev)

      - name: Run tests with coverage
        run: uv run pytest --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: safeuploads-coverage
          path: .coverage
          retention-days: 7
