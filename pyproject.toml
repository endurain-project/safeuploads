[project]
name = "safeuploads"
version = "1.1.1"
description = "A comprehensive file security system for validating uploads and preventing attacks"
authors = [
    {name = "João Vitória Silva",email = "joao@endurain.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-magic>=0.4.27,<0.5.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110,<1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=4.1,<8.0",
    "ruff>=0.9.0",
    "hypothesis>=6.100,<7.0",
    "mypy>=1.20.2",
    "types-defusedxml",
    # HTTP stack for the FastAPI multipart integration test
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
]
# Kept out of `dev` because a mutation run is scheduled, not something
# you want resolved on every local sync.
mutation = [
    "mutmut>=3.2,<4.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "0.12.5"
exclude-newer = "30 days"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "A",      # flake8-builtins
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "ASYNC",  # flake8-async (blocking calls in async defs)
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle
]

[tool.ruff.lint.per-file-ignores]
"safeuploads/enums.py" = [
    "RUF012",  # Enum member values are singletons, not shared
               # mutable class state
]
"safeuploads/__init__.py" = [
    "RUF022",  # __all__ is intentionally grouped by category,
               # not alphabetically sorted
]
"tests/**/*.py" = [
    "S101",   # assert is expected in tests
    "D",      # no docstring enforcement in tests
    "T201",   # print is expected for benchmark/perf output
    "ASYNC251",  # time.sleep in async test doubles simulates
                 # real blocking I/O on purpose
]
"tests/conftest.py" = [
    "S101",
    "D",
]
"tests/fuzz/**/*.py" = [
    "S101",
    "D",
]
"examples/**/*.py" = [
    "D",      # no docstring enforcement in examples
    "T201",   # print is expected in examples
]
".github/scripts/**/*.py" = [
    "T201",   # print is the intended output channel for CI scripts
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=safeuploads",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "performance: Performance and benchmarking tests",
    "fuzz: Hypothesis-based fuzzing tests",
    "corpus: Regression corpus of known upload attacks",
]

[tool.coverage.run]
source = ["safeuploads"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mutmut]
source_paths = ["safeuploads/"]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut's trampoline cannot instrument the static methods that
# config.py calls from its own class body, so importing a mutated
# copy fails outright. Excluded rather than reshaping the module
# to suit the tool.
do_not_mutate = ["safeuploads/config.py"]
# Coverage reporting and the slow suites would be paid once per
# mutant, so drop them: mutation scoring only needs pass/fail.
pytest_add_cli_args = [
    "--no-cov",
    "-p",
    "no:cacheprovider",
    "-m",
    "not performance and not fuzz",
]
# Line coverage says a line ran; a surviving mutant says nothing
# asserted on it. Run on a schedule, read as a signal, not a gate.

[tool.mypy]
python_version = "3.11"
incremental = false
# strict = true enables the full strict bundle, including
# disallow_any_generics, warn_return_any, disallow_untyped_calls,
# disallow_incomplete_defs, disallow_untyped_decorators, and
# strict_equality, so a bare `Any` cannot silently satisfy the
# type checker and every def must be fully and precisely typed.
strict = true
mypy_path = ["safeuploads"]
files = ["safeuploads"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["magic", "fastapi"]
ignore_missing_imports = true
