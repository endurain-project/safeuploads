name: Scheduled Fuzz

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Cancel in-progress runs for the same branch to avoid wasted
# runner minutes.
concurrency:
  group: ${{ forge.workflow }}-${{ forge.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: local-runner

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: .

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Run fuzz tests
        run: >
          uv run pytest -m fuzz
          --hypothesis-seed=0
          -x
          --tb=short
          -q
