name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate PR title
        # The title only changes on opened/edited/reopened. Skipping it on
        # `synchronize` keeps a push to a branch shared with another open PR
        # (for example a WIP umbrella PR) from failing on that PR's title
        # before the commit-range check below can run.
        if: github.event.action != 'synchronize'
        # The PR title is untrusted data: passed through an environment variable
        # (never interpolated into the shell) to the trusted base-ref checker.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 .github/scripts/check_conventional_commits.py "$PR_TITLE"

      - name: Validate commits in PR
        # Validates every commit subject between the PR base and head. Use the
        # base/head SHAs from the event payload so we don't depend on the local
        # checkout ref layout.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git log --no-merges --format=%s "$BASE_SHA".."$HEAD_SHA" \
            | python3 .github/scripts/check_conventional_commits.py --stdin
