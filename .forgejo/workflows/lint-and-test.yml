name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to avoid wasted
# runner minutes and race conditions on shared resources.
concurrency:
  group: ${{ forge.workflow }}-${{ forge.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # Lint
  # Runs ruff on all Python sources. Fails fast so test job is only
  # triggered when the code is clean.
  # ----------------------------------------------------------------
  lint:
    name: Lint
    runs-on: codeberg-tiny

    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: .

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint with ruff
        run: uv run ruff check safeuploads tests examples

      - name: Check formatting with ruff
        run: uv run ruff format --check safeuploads tests examples

      - name: Type check with mypy
        run: uv run mypy

  # ----------------------------------------------------------------
  # Test
  # Runs the full pytest suite with coverage. Only runs after lint
  # passes so we don't waste runner minutes on broken code.
  # ----------------------------------------------------------------
  test:
    name: Test
    runs-on: local-runner
    needs: lint

    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install uv
        uses: https://data.forgejo.org/astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          working-directory: .

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Audit Python dependencies
        run: uvx pip-audit --require-hashes --disable-pip -r <(uv export --frozen --no-header --no-emit-project --no-dev)

      - name: Run tests with coverage
        run: uv run pytest --cov-fail-under=90

      - name: Upload coverage report
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: safeuploads-coverage
          path: .coverage
          retention-days: 7
